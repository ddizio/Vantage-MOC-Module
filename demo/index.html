<!DOCTYPE html>
<!--
  Vantage MOC — STATIC CLICK-THROUGH DEMO

  This single file is a front-end prototype of the Vantage Management of Change
  application. It runs entirely in the browser with sample data stored in
  localStorage. It has NO server, NO real database, and NO real security — it
  exists so the workflow and look-and-feel can be shown in any static-file
  hosting environment.

  The real, production application (with authentication, a database, real
  electronic signatures, multi-site support, and email notifications) lives in
  the rest of this repository and must be deployed to a host that runs Node.js.
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vantage MOC — Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" />
<style>
  :root {
    --green: #00b388; --green-d: #008264; --green-t: #038264;
    --blue: #015b9a; --bright: #97c93c; --sky: #57c8e7;
    --orange: #f15f22; --yellow: #f3b64f;
    --ink: #161617; --ink2: #3d3b3e; --ink3: #6b6a6d;
    --line: #e3e5e3; --bg: #f7f8f7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Poppins", "Century Gothic", system-ui, -apple-system, sans-serif;
    font-size: 14px; line-height: 1.5;
  }
  a { color: var(--blue); text-decoration: none; cursor: pointer; }
  a:hover { text-decoration: underline; }
  button { font-family: inherit; cursor: pointer; }
  .hidden { display: none !important; }

  /* Header */
  header {
    background: #fff; border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 30;
  }
  .hbar { max-width: 1100px; margin: 0 auto; padding: 0 16px; height: 60px;
    display: flex; align-items: center; gap: 18px; }
  .logo { height: 30px; }
  .badge-moc { font-size: 13px; font-weight: 600; letter-spacing: .04em;
    color: var(--green-d); border-left: 1px solid var(--line); padding-left: 12px; }
  nav.main { display: flex; align-items: center; gap: 2px; font-weight: 500; }
  nav.main a { color: var(--ink2); padding: 8px 12px; border-radius: 6px; }
  nav.main a:hover { background: #e6f7f3; color: var(--green-t); text-decoration: none; }
  nav.main a.cta { background: var(--green); color: #fff; }
  nav.main a.cta:hover { background: var(--green-d); }
  .spacer { margin-left: auto; }
  .who { font-size: 13px; color: var(--ink2); display: flex; align-items: center; gap: 10px; }
  .who select { font-family: inherit; font-size: 13px; padding: 5px 8px; border: 1px solid var(--line);
    border-radius: 6px; background: #fff; }

  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }

  h1 { font-size: 24px; margin: 0 0 4px; }
  h2 { font-size: 16px; margin: 0; }
  .muted { color: var(--ink3); font-size: 13px; }

  /* Cards */
  .card { background: #fff; border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 1px 2px rgba(0,0,0,.03); margin-bottom: 18px; }
  .card > .chead { padding: 14px 18px 10px; border-bottom: 1px solid #f0f1f0; }
  .card > .chead h2 { font-size: 15px; }
  .card > .cbody { padding: 16px 18px; }
  .grid2 { display: grid; grid-template-columns: 2fr 1fr; gap: 18px; }
  @media (max-width: 820px){ .grid2 { grid-template-columns: 1fr; } }

  /* Badges */
  .pill { display: inline-flex; align-items: center; border-radius: 999px;
    padding: 2px 10px; font-size: 12px; font-weight: 500; border: 1px solid; }
  .st-DRAFT{background:#f3f4f6;color:#374151;border-color:#d1d5db}
  .st-REVIEW{background:#fffbeb;color:#92651a;border-color:#fcd9a0}
  .st-IMPLEMENTATION{background:#f0f9ff;color:#075985;border-color:#bae6fd}
  .st-HANDOVER{background:#eef2ff;color:#3730a3;border-color:#c7d2fe}
  .st-CLOSEOUT{background:#f0fdfa;color:#115e59;border-color:#99f6e4}
  .st-ACTIVE{background:#fff7ed;color:#9a3412;border-color:#fed7aa}
  .st-CLOSED{background:#ecfdf5;color:#065f46;border-color:#a7f3d0}
  .st-REJECTED{background:#fef2f2;color:#991b1b;border-color:#fecaca}
  .st-CANCELED{background:#f3f4f6;color:#6b7280;border-color:#d1d5db}
  .lv1{background:#e6f7f3;color:var(--green-t);border-color:#c2ede2}
  .lv2{background:#f0f9ff;color:#075985;border-color:#bae6fd}
  .lv3{background:#fffbeb;color:#92651a;border-color:#fcd9a0}
  .lv4{background:#fef2f2;color:#991b1b;border-color:#fecaca}
  .pill.temp{background:#fffbeb;color:#92651a;border-color:#fcd9a0}

  /* Tables */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-size: 11px; color: var(--ink3); font-weight: 600;
    padding: 6px 8px; border-bottom: 1px solid var(--line); text-transform: uppercase; letter-spacing:.03em;}
  td { padding: 8px; border-bottom: 1px solid #f0f1f0; vertical-align: top; }
  tr:hover td { background: #fafbfa; }

  /* Forms */
  label.fld { display: block; margin-bottom: 14px; }
  label.fld > span { font-weight: 500; color: var(--ink2); font-size: 13px; }
  label.fld > .hint { display:block; color: var(--ink3); font-size: 12px; margin-top: 2px; font-weight:400;}
  input[type=text], input[type=date], input[type=datetime-local], textarea, select.fi {
    width: 100%; margin-top: 5px; padding: 9px 11px; border: 1px solid #cfd3cf;
    border-radius: 7px; font-family: inherit; font-size: 14px; background: #fff; }
  textarea { resize: vertical; }
  input:focus, textarea:focus, select.fi:focus { outline: 2px solid var(--green); border-color: var(--green); }

  .btn { border: 1px solid var(--green); background: var(--green); color: #fff;
    padding: 9px 16px; border-radius: 7px; font-size: 14px; font-weight: 600; }
  .btn:hover { background: var(--green-d); border-color: var(--green-d); }
  .btn.ghost { background: #fff; color: var(--ink2); border-color: #cfd3cf; }
  .btn.ghost:hover { background: #f3f4f3; }
  .btn.blue { background: var(--blue); border-color: var(--blue); }
  .btn.orange { background: var(--orange); border-color: var(--orange); }
  .btn.sm { padding: 6px 11px; font-size: 12.5px; }

  /* Choice tiles */
  .tile { display:block; width:100%; text-align:left; background:#fff; border:1px solid var(--line);
    border-radius:10px; padding:18px; margin-bottom:12px; }
  .tile:hover { border-color: var(--green); box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .tile h3 { margin:0 0 4px; color: var(--green-t); font-size:15px; }
  .tile p { margin:0; color: var(--ink3); font-size:13px; }

  .toggle { display:flex; gap:8px; margin-top:5px; }
  .toggle button { flex:1; border:1px solid #cfd3cf; background:#fff; color:var(--ink3);
    padding:9px; border-radius:7px; font-weight:500; font-size:13px; }
  .toggle button.on { border-color: var(--green); background:#e6f7f3; color: var(--green-t); }

  /* Workflow stepper */
  .stepper { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom: 18px; }
  .step { border-radius:999px; padding:5px 12px; font-size:12px; font-weight:500; border:1px solid var(--line);
    background:#fff; color:var(--ink3); }
  .step.done { background: var(--green); border-color: var(--green); color:#fff; }
  .step.cur { background:#fffbeb; border-color:#fcd9a0; color:#92651a; }
  .step.rej { background:#fef2f2; border-color:#fecaca; color:#991b1b; }
  .arrow { color:#c9ccc9; }

  .sigrow { border:1px solid var(--line); border-radius:8px; padding:10px; margin-bottom:8px; }
  .sigrow .top { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .ok { color: var(--green-t); font-weight:600; font-size:12px; }
  .pend { color:#92651a; font-size:12px; }
  .no { color:#991b1b; font-weight:600; font-size:12px; }

  .banner { border-radius:8px; padding:10px 14px; font-size:13px; margin-bottom:14px; }
  .banner.warn { background:#fff7ed; border:1px solid #fed7aa; color:#9a3412; }
  .banner.info { background:#e6f7f3; border:1px solid #c2ede2; color: var(--green-t); }
  .banner.note { background:#f0f9ff; border:1px solid #bae6fd; color:#075985; }

  .demo-flag { background: var(--ink); color:#fff; font-size:12px; text-align:center; padding:6px 10px; }
  .demo-flag a { color: var(--bright); }

  /* Login */
  .login-wrap { max-width: 380px; margin: 6vh auto; }
  .login-card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:30px; text-align:center; }
  .persona { display:flex; flex-direction:column; gap:8px; margin-top:18px; text-align:left; }
  .persona button { border:1px solid var(--line); background:#fff; border-radius:8px; padding:10px 12px;
    display:flex; justify-content:space-between; align-items:center; }
  .persona button:hover { border-color: var(--green); background:#f6fffb; }
  .persona .role { font-size:12px; color: var(--ink3); }

  dl.kv { margin:0; display:grid; grid-template-columns: 1fr 1fr; gap:10px 24px; }
  dl.kv dt { font-size:11px; color: var(--ink3); text-transform:uppercase; letter-spacing:.03em; }
  dl.kv dd { margin:0 0 6px; }
  .section-h { font-size:11px; color:var(--ink3); text-transform:uppercase; letter-spacing:.04em; margin:14px 0 4px;}
</style>
</head>

</div>

const WORKFLOWS = {

      {role:"PROCESS_SAFETY",label:"Process Safety"},
      {role:"RELEVANT_MANAGER",label:"Relevant Manager"}], next:"IMPLEMENTATION", auto:false},
    {stage:"CLOSEOUT", title:"Close-Out", sigs:[
      {role:"MOC_LEAD",label:"MOC Lead"},
      {role:"PROCESS_SAFETY",label:"Process Safety"}], next:"CLOSED", auto:false},
  ],
  LEVEL2: [
    {stage:"APPROVAL_TO_PROCEED", title:"Approval to Proceed", sigs:[

      {role:"MAINTENANCE_MANAGER",label:"Maintenance Manager"},

    {stage:"HANDOVER", title:"Handover & Commissioning", sigs:[
      {role:"PRODUCTION_MANAGER",label:"Production Manager"}], next:"CLOSEOUT", auto:true},
    {stage:"CLOSEOUT", title:"Close-Out", sigs:[

  MOOC: [

const USERS = [

  {id:"u-sam",   name:"Sam Okafor", roles:["SITE_MANAGER"]},
];
const userById = id => USERS.find(u=>u.id===id);
const holderOf = role => USERS.find(u=>u.roles.includes(role));

function determineLevel(deg, sig){
  if(deg==="LOW") return sig==="LOW"?1:2;
  return sig==="LOW"?3:4;
}

// ---- persistent state ----
// DB is declared before load() runs because load() -> save() assigns to DB.
const LS_KEY = "vmoc_demo_v1";
let DB = null;
DB = load();

function seed(){
  const today = new Date();
  const iso = d => d.toISOString().slice(0,10);
  const plus = n => { const d=new Date(); d.setDate(d.getDate()+n); return iso(d); };
  let seq = 0;
  const num = () => "GUR-2026-"+String(++seq).padStart(4,"0");

  const mocs = [];
  // 1) Level 2 in REVIEW — Jamie's, waiting on the approval chain
  mocs.push(makeMoc({
    number:num(), type:"LEVEL2", level:3, title:"Install spare caustic transfer pump P-204B",
    leadId:"u-jamie", status:"REVIEW", changeType:"PERMANENT",
    deg:"HIGH", sig:"LOW", relevantManagerId:"u-pat",
    form:{asset:"P-204", plantArea:"Tank Farm", summary:"Add a redundant transfer pump in parallel with P-204A.",
      technicalBasis:"Single pump is a production bottleneck and a single point of failure. Parallel spare with isolation valves; no change to fluid, pressure, or temperature envelope.",
      phaType:"WHAT_IF", phaJustification:"Level 3 — What-If review of tie-in and isolation."},
    openStage:"APPROVAL_TO_PROCEED",
  }));
  // 2) Level 1 CLOSED
  mocs.push(makeMoc({
    number:num(), type:"LEVEL1", level:1, title:"Relocate eyewash station near drum filling",
    leadId:"u-jamie", status:"CLOSED", changeType:"PERMANENT", deg:"LOW", sig:"LOW",
    relevantManagerId:"u-pat",
    form:{asset:"Drum Fill", plantArea:"Packaging", summary:"Move eyewash 4 m to within 10 s of the fill point.",
      technicalBasis:"Improves emergency access per ANSI Z358.1.", safetyEnvImpact:"Positive — faster access; no new hazards."},
    closed:true,
  }));
  // 3) Temporary, overdue
  mocs.push(makeMoc({
    number:num(), type:"LEVEL2", level:2, title:"Temporary bypass piping for heat exchanger E-310 cleaning",
    leadId:"u-jamie", status:"IMPLEMENTATION", changeType:"TEMPORARY", endDate:plus(-3),
    deg:"LOW", sig:"HIGH",
    form:{asset:"E-310", plantArea:"Reaction", summary:"Temporary jumper to keep line in service during exchanger clean.",
      technicalBasis:"Maintains production during scheduled clean; restored after.", phaType:"NONE"},
    approvedThrough:"APPROVAL_TO_PROCEED",
  }));
  // 4) Bypass ACTIVE
  mocs.push(makeMoc({
    number:num(), type:"BYPASS", level:null, title:"Bypass high-level interlock on Tank T-105 for sensor swap",
    leadId:"u-jamie", status:"ACTIVE", changeType:"TEMPORARY", endDate:plus(2),
    approvingManagerId:"u-pat",
    form:{deviceDescription:"LSHH-105 high-high level interlock",
      bypassDescription:"Force interlock to bypass while transmitter is replaced.",
      protectedEquipment:"Tank T-105 (overfill protection)",
      hazardExplanation:"Prevents overfill / overflow of flammable feedstock (ref PHA-2024-07).",
      reason:"Transmitter failed; swap requires interlock offline ~6 h.",
      alternateProtection:"Dedicated operator stationed at local level gauge with radio; filling rate reduced 50%; supervisor notified.",
      implementerName:"Jamie Chen"},
    approvedThrough:"BYPASS_APPROVAL",
  }));

  return { mocs, seqSite:{GUR:seq} };
}

function makeMoc(o){
  const id = "moc-"+Math.random().toString(36).slice(2,9);
  const m = {
    id, number:o.number, type:o.type, level:o.level, title:o.title, leadId:o.leadId,
    status:"DRAFT", changeType:o.changeType||"PERMANENT", startDate:o.startDate||null,
    endDate:o.endDate||null, deg:o.deg||null, sig:o.sig||null, form:o.form||{},
    relevantManagerId:o.relevantManagerId||null, approvingManagerId:o.approvingManagerId||null,
    approvals:[], audit:[], createdAt:new Date().toISOString(),
  };
  addAudit(m,"u-jamie","MOC created", m.number);
  // Build approval history to reach the requested state
  const wf = WORKFLOWS[o.type];
  const advanceTo = (targetStage, signAll) => {
    for(const st of wf){
      openStageOn(m, st);
      if(signAll){
        for(const a of m.approvals.filter(a=>a.stage===st.stage && a.decision==="PENDING")){
          a.decision="APPROVED"; a.signedName=userById(a.assignedToId)?.name||"—";
          a.at=new Date().toISOString();
          addAudit(m, a.assignedToId, "Signed / approved: "+a.label, st.title);
        }
        m.status = st.next;
      }
      if(st.stage===targetStage) return;
    }
  };

  if(o.closed){
    advanceTo(wf[wf.length-1].stage, true);
    m.status="CLOSED"; m.closedAt=new Date().toISOString();
  } else if(o.approvedThrough){
    // sign through the named stage, then leave at its "next" status
    for(let i=0;i<wf.length;i++){
      const st = wf[i];
      openStageOn(m, st);
      for(const a of m.approvals.filter(a=>a.stage===st.stage && a.decision==="PENDING")){
        a.decision="APPROVED"; a.signedName=userById(a.assignedToId)?.name||"—"; a.at=new Date().toISOString();
        addAudit(m, a.assignedToId, "Signed / approved: "+a.label, st.title);
      }
      m.status = st.next;
      if(st.stage===o.approvedThrough){
        // mirror the live auto-open: if this stage auto-advances, open the next
        // stage so its signatures are ready (e.g. bypass -> Return to Service).
        if(st.auto && wf[i+1] && st.next!=="CLOSED") openStageOn(m, wf[i+1]);
        break;
      }
    }
  } else if(o.openStage || o.status==="REVIEW"){
    openStageOn(m, wf[0]);
    m.status = wf[0].stage==="TRANSITION_PLAN" ? "REVIEW" : (o.type==="BYPASS"?"REVIEW":"REVIEW");
    m.status="REVIEW";
    addAudit(m, m.leadId, "Submitted for approval");
  }
  return m;
}

function openStageOn(m, st){
  if(m.approvals.some(a=>a.stage===st.stage)) return;
  for(const s of st.sigs){
    m.approvals.push({
      id:"ap-"+Math.random().toString(36).slice(2,9),
      stage:st.stage, role:s.role, label:s.label,
      assignedToId: resolveAssignee(m, s.role),
      decision:"PENDING", signedName:null, comment:null, at:null,
    });
  }
}
function resolveAssignee(m, role){
  if(role==="MOC_LEAD") return m.leadId;
  if(role==="RELEVANT_MANAGER") return m.relevantManagerId;
  if(role==="APPROVING_MANAGER") return m.approvingManagerId;
  return holderOf(role)?.id || null;
}
function addAudit(m, userId, action, detail){
  m.audit.unshift({userId, action, detail:detail||null, at:new Date().toISOString()});
}

function load(){
  try { const s = localStorage.getItem(LS_KEY); if(s) return JSON.parse(s); } catch(e){}

function fmtDate(s){ return s ? s.slice(0,10) : "—"; }
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function levelPill(l){ return l? `<span class="pill lv${l}">Level ${l}</span>`:""; }
function statusPill(s){ return `<span class="pill st-${s}">${STATUS_LABELS[s]||s}</span>`; }

function currentStageOf(m){
  if(m.type==="BYPASS" && m.status==="ACTIVE") return WORKFLOWS.BYPASS.find(s=>s.stage==="RESTORATION");
  return WORKFLOWS[m.type].find(s=>s.status===m.status) || WORKFLOWS[m.type].find(s=>{
    const rows=m.approvals.filter(a=>a.stage===s.stage); return rows.length && rows.some(a=>a.decision==="PENDING");
  });
}

function viewMoc(id){
  const m = DB.mocs.find(x=>x.id===id);
  if(!m) return `<p>Not found. <a data-go="register">Back to register</a></p>`;
  const wf = WORKFLOWS[m.type];
  const me = userById(CURRENT);
  const isLead = m.leadId===CURRENT;
  const open = !["CLOSED","CANCELED"].includes(m.status);
  const f = m.form;

  let h = `<a data-go="register">← MOC Register</a>`;
  h += `<div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:flex-start;margin:8px 0 4px">
    <div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <h1 style="margin:0">${esc(m.number)}</h1>${levelPill(m.level)}${statusPill(m.status)}
      ${m.changeType==="TEMPORARY"?`<span class="pill temp">Temporary → ${fmtDate(m.endDate)}</span>`:""}</div>
      <p style="font-size:17px;color:var(--ink2);margin:4px 0 2px">${esc(m.title)}</p>
      <p class="muted">${esc(TYPE_LABELS[m.type])} · Gurnee (GUR) · Lead: ${esc(userById(m.leadId)?.name)}</p></div></div>`;

  // stepper
  h += `<div class="stepper">`;
  wf.forEach((st,i)=>{
    const rows = m.approvals.filter(a=>a.stage===st.stage);
    const done = rows.length && rows.every(a=>a.decision==="APPROVED");
    const cur = rows.some(a=>a.decision==="PENDING");
    const rej = rows.some(a=>a.decision==="REJECTED");
    h += (i? `<span class="arrow">→</span>`:"")+
      `<span class="step ${rej?"rej":done?"done":cur?"cur":""}">${done?"✓ ":""}${esc(st.title)}</span>`;
  });
  h += `</div>`;

  // draft submit
  if(["DRAFT","REJECTED"].includes(m.status) && isLead){
    h += `<div class="card"><div class="chead"><h2>${m.status==="REJECTED"?"Revise & resubmit":"Submit for approval"}</h2></div><div class="cbody">
      <form id="submitForm">`;
    if(m.type==="LEVEL1"||m.type==="MOOC")
      h += `<label class="fld"><span>Relevant Manager (cannot be the lead)</span>
        <select class="fi" name="relevantManagerId" required><option value="">Select…</option>${
          USERS.filter(u=>u.id!==m.leadId).map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join("")}</select></label>`;
    if(m.type==="BYPASS")
      h += `<label class="fld"><span>Approving Manager</span>
        <select class="fi" name="approvingManagerId" required><option value="">Select…</option>${
          USERS.map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join("")}</select></label>`;
    h += `<button class="btn" type="submit">Submit for approval</button></form></div></div>`;
  }

  h += `<div class="grid2"><div>`;

  // scope card
  h += `<div class="card"><div class="chead"><h2>Scope</h2></div><div class="cbody">`;
  h += `<dl class="kv">`;
  if(m.type==="LEVEL1"||m.type==="LEVEL2"){
    h += `<div><dt>Asset</dt><dd>${esc(f.asset||"—")}</dd></div><div><dt>Plant area</dt><dd>${esc(f.plantArea||"—")}</dd></div>`;
    h += `<div><dt>Hazard assessment</dt><dd>${esc(m.deg)} hazard × ${esc(m.sig)} significance → <b>Level ${m.level}</b></dd></div>`;
  }
  h += `<div><dt>Type</dt><dd>${m.changeType==="TEMPORARY"?"Temporary (ends "+fmtDate(m.endDate)+")":"Permanent"}</dd></div></dl>`;
  if(m.type==="LEVEL1"||m.type==="LEVEL2"){
    h += `<div class="section-h">Brief summary</div><div>${esc(f.summary||"—")}</div>
      <div class="section-h">Technical basis for change</div><div>${esc(f.technicalBasis||"—")}</div>`;
    if(m.type==="LEVEL1") h += `<div class="section-h">Impact on safety & environment</div><div>${esc(f.safetyEnvImpact||"—")}</div>`;
    if(m.type==="LEVEL2") h += `<div class="section-h">Process Hazard Review</div><div>${esc(f.phaType||"—")}${f.phaJustification?" — "+esc(f.phaJustification):""}</div>`;
  }
  if(m.type==="MOOC") h += `<div class="section-h">Job title</div><div>${esc(f.jobTitle||"—")}</div>
    <div class="section-h">Job description</div><div>${esc(f.jobDescription||"—")}</div>`;
  if(m.type==="BYPASS") h += `<div class="section-h">Bypassed device</div><div>${esc(f.deviceDescription||"—")}</div>
    <div class="section-h">Hazard protected against</div><div>${esc(f.hazardExplanation||"—")}</div>
    <div class="section-h">Alternate protection plan</div><div>${esc(f.alternateProtection||"—")}</div>`;
  h += `</div></div>`;

  // audit
  h += `<div class="card"><div class="chead"><h2>Audit Trail</h2></div><div class="cbody">`;
  h += m.audit.map(e=>`<div style="font-size:12px;color:var(--ink3);padding:3px 0;border-bottom:1px solid #f5f6f5">
    <b style="color:var(--ink2)">${esc(e.action)}</b>${e.detail?" — "+esc(e.detail):""}<br>
    ${esc(userById(e.userId)?.name||"System")} · ${e.at.slice(0,16).replace("T"," ")}</div>`).join("");
  h += `</div></div>`;

  h += `</div><div>`; // right column

  // signatures
  h += `<div class="card"><div class="chead"><h2>Signatures</h2><p class="muted">Electronic signatures with timestamps</p></div><div class="cbody">`;
  if(!m.approvals.length) h += `<p class="muted">No signatures yet — created when the record is submitted.</p>`;
  const byStage = {};
  m.approvals.forEach(a=>{ (byStage[a.stage]=byStage[a.stage]||[]).push(a); });
  Object.keys(byStage).forEach(sk=>{
    const st = wf.find(s=>s.stage===sk);
    h += `<div class="section-h">${esc(st?st.title:sk)}</div>`;
    byStage[sk].forEach(a=>{
      h += `<div class="sigrow"><div class="top"><span style="font-weight:600;font-size:12.5px">${esc(a.label)}</span>`;
      h += a.decision==="APPROVED"?`<span class="ok">✓ Approved</span>`:
           a.decision==="REJECTED"?`<span class="no">✗ Not approved</span>`:`<span class="pend">Pending</span>`;
      h += `</div><div class="muted" style="font-size:12px;margin-top:3px">`;
      h += a.decision==="PENDING"
        ? `Assigned to ${esc(userById(a.assignedToId)?.name||"unassigned")}`
        : `Signed <b>${esc(a.signedName)}</b> · ${a.at? a.at.slice(0,16).replace("T"," "):""}`;
      h += `</div>`;
      if(a.comment) h += `<div style="font-size:12px;margin-top:3px">“${esc(a.comment)}”</div>`;
      if(a.decision==="PENDING" && open && a.assignedToId===CURRENT)
        h += `<div style="margin-top:8px"><button class="btn sm" data-sign="${a.id}" data-moc="${m.id}">Review &amp; Sign</button></div>`;
      h += `</div>`;
    });
  });
  h += `</div></div>`;

  h += `</div></div>`;
  return h;
}

    <p class="muted" style="margin-top:8px">Level 3 requires a What-If PHA; Level 4 requires a HAZOP.</p></div></div>
  <div class="card"><div class="chead"><h2>Trying the demo</h2></div><div class="cbody">
    <p>Use the <b>Acting as</b> picker (top right) to switch between people. Create an MOC as Jamie Chen, submit it, then switch to the assigned approver to sign it — watch the workflow advance. Everything is sample data in your browser; use <b>Reset demo data</b> (top bar) to start over.</p></div></div>`;
}

// =====================================================================
//  Render + events
// =====================================================================
function render(){
  renderHeader();
  const app = document.getElementById("app");
  let html = "";
  switch(ROUTE.name){
    case "dashboard": html = viewDashboard(); break;
    case "register":  html = viewRegister(); break;
    case "new":       html = viewNew(); break;
    case "help":      html = viewHelp(); break;
    case "moc":       html = viewMoc(ROUTE.id); break;
    default:          html = viewDashboard();
  }
  app.innerHTML = html;
}

// global click handling (delegation)
document.addEventListener("click", e=>{
  const t = e.target.closest("[data-go],[data-moc],[data-kind],[data-newback],[data-sign],[data-v],[data-grp]");
  if(e.target.id==="resetLink"){ if(confirm("Reset all demo data?")) resetDemo(); return; }
  if(!t) return;

  if(t.hasAttribute("data-sign")){ openSignDialog(t.getAttribute("data-sign"), t.getAttribute("data-moc")); return; }
  if(t.hasAttribute("data-moc") && !t.hasAttribute("data-sign")){ go("moc",{id:t.getAttribute("data-moc")}); return; }
  if(t.hasAttribute("data-go")){ if(t.getAttribute("data-go")==="new"){ NEW.kind=null; NEW.deg=""; NEW.sig=""; NEW.changeType="PERMANENT"; } go(t.getAttribute("data-go")); return; }
  if(t.hasAttribute("data-kind")){ NEW.kind=t.getAttribute("data-kind"); render(); return; }
  if(t.hasAttribute("data-newback")){ NEW.kind=null; render(); return; }
  if(t.closest("[data-grp]")){
    const grp = t.closest("[data-grp]").getAttribute("data-grp"); const v=t.getAttribute("data-v");
    if(grp==="deg") NEW.deg=v; if(grp==="sig") NEW.sig=v; if(grp==="ct") NEW.changeType=v;
    render(); return;
  }
});

document.getElementById("personaSel").addEventListener("change", e=>{ CURRENT=e.target.value; render(); });

// form submit (new MOC + submit-for-approval)
document.addEventListener("submit", e=>{
  if(e.target.id==="mocForm"){ e.preventDefault(); createMoc(new FormData(e.target)); }
  if(e.target.id==="submitForm"){ e.preventDefault(); submitForApproval(ROUTE.id, new FormData(e.target)); }
});

function createMoc(fd){
  const kind = NEW.kind;
  const type = kind==="CHANGE" ? (determineLevel(NEW.deg,NEW.sig)===1?"LEVEL1":"LEVEL2") : kind;
  if(kind==="CHANGE" && !(NEW.deg && NEW.sig)){ alert("Complete the hazard assessment first."); return; }
  DB.seqSite.GUR = (DB.seqSite.GUR||0)+1;
  const number = "GUR-2026-"+String(DB.seqSite.GUR).padStart(4,"0");
  const form = {};
  ["asset","plantArea","summary","technicalBasis","phaType","jobTitle","jobDescription",
   "deviceDescription","hazardExplanation","alternateProtection"].forEach(k=>{ if(fd.get(k)) form[k]=fd.get(k); });
  const m = {
    id:"moc-"+Math.random().toString(36).slice(2,9), number, type,
    level: kind==="CHANGE"?determineLevel(NEW.deg,NEW.sig):null,
    title: fd.get("title"), leadId: CURRENT, status:"DRAFT",
    changeType: NEW.changeType, startDate:null, endDate: fd.get("endDate")||null,
    deg: kind==="CHANGE"?NEW.deg:null, sig: kind==="CHANGE"?NEW.sig:null,
    form, relevantManagerId:null, approvingManagerId:null, approvals:[], audit:[], createdAt:new Date().toISOString(),
  };
  addAudit(m, CURRENT, "MOC created", number);
  DB.mocs.unshift(m); save();
  go("moc",{id:m.id});
}

function submitForApproval(id, fd){
  const m = DB.mocs.find(x=>x.id===id); if(!m) return;
  if(m.type==="LEVEL1"||m.type==="MOOC"){
    const rm = fd.get("relevantManagerId"); if(!rm){ alert("Select the Relevant Manager."); return; }
    if(rm===m.leadId){ alert("The Relevant Manager cannot be the MOC Lead."); return; }
    m.relevantManagerId = rm;
  }
  if(m.type==="BYPASS"){ const am=fd.get("approvingManagerId"); if(!am){ alert("Select the Approving Manager."); return; } m.approvingManagerId=am; }
  m.approvals = [];
  openStageOn(m, WORKFLOWS[m.type][0]);
  m.status = "REVIEW";
  addAudit(m, CURRENT, "Submitted for approval");
  save(); go("moc",{id});
}

// ---- signature dialog ----
function openSignDialog(approvalId, mocId){
  const m = DB.mocs.find(x=>x.id===mocId); const a = m.approvals.find(x=>x.id===approvalId);
  const ov = document.createElement("div");
  ov.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px";
  ov.innerHTML = `<div style="background:#fff;border-radius:12px;max-width:420px;width:100%">
    <div style="padding:16px 20px;border-bottom:1px solid var(--line)"><h2>Electronic Signature</h2>
      <p class="muted" style="margin:4px 0 0">Signing as <b>${esc(a.label)}</b> — ${esc(userById(a.assignedToId)?.name)}</p></div>
    <form id="sigForm" style="padding:16px 20px">
      <div class="toggle" data-sg="dec" style="margin-bottom:12px">
        <button type="button" data-dv="APPROVED" class="on">Approved to Proceed</button>
        <button type="button" data-dv="REJECTED">Not Approved</button></div>
      <label class="fld"><span>Type your full name (signature)</span><input type="text" id="sigName" value="${esc(userById(a.assignedToId)?.name)}" required></label>
      <label class="fld"><span>Password (demo — any value)</span><input type="text" id="sigPwd" placeholder="••••••" required></label>
      <label class="fld"><span>Comment</span><textarea id="sigComment" rows="2"></textarea></label>
      <p class="muted" style="font-size:11px">By signing you certify this is the legal equivalent of your handwritten signature. <i>(Demo: not legally binding.)</i></p>
      <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:8px">
        <button type="button" class="btn ghost" id="sigCancel">Cancel</button>
        <button type="submit" class="btn" id="sigGo">Sign</button></div>
    </form></div>`;
  document.body.appendChild(ov);
  let decision="APPROVED";
  ov.querySelector("[data-sg=dec]").addEventListener("click", e=>{
    const b=e.target.closest("[data-dv]"); if(!b) return;
    decision=b.getAttribute("data-dv");
    ov.querySelectorAll("[data-sg=dec] button").forEach(x=>x.classList.toggle("on", x===b));
    ov.querySelector("#sigGo").style.background = decision==="REJECTED"?"var(--orange)":"";
    ov.querySelector("#sigGo").style.borderColor = decision==="REJECTED"?"var(--orange)":"";
  });
  ov.querySelector("#sigCancel").onclick = ()=> ov.remove();
  ov.querySelector("#sigForm").onsubmit = ev=>{
    ev.preventDefault();
    const name = ov.querySelector("#sigName").value.trim();
    const pwd = ov.querySelector("#sigPwd").value.trim();
    const comment = ov.querySelector("#sigComment").value.trim();
    if(!name || !pwd){ alert("Name and password are required."); return; }
    if(decision==="REJECTED" && !comment){ alert("A comment is required when not approving."); return; }
    applySignature(mocId, approvalId, decision, name, comment);
    ov.remove();
  };
}

function applySignature(mocId, approvalId, decision, name, comment){
  const m = DB.mocs.find(x=>x.id===mocId);
  const a = m.approvals.find(x=>x.id===approvalId);
  a.decision = decision; a.signedName = name; a.comment = comment||null; a.at = new Date().toISOString();
  addAudit(m, CURRENT, (decision==="APPROVED"?"Signed / approved: ":"Not approved: ")+a.label, comment||null);

  if(decision==="REJECTED"){ m.status="REJECTED"; save(); go("moc",{id:mocId}); return; }

  // stage complete?
  const wf = WORKFLOWS[m.type];
  const stageKey = a.stage;
  const st = wf.find(s=>s.stage===stageKey);
  const rows = m.approvals.filter(x=>x.stage===stageKey);
  if(rows.every(x=>x.decision==="APPROVED")){
    m.status = st.next;
    addAudit(m, CURRENT, "Stage complete: "+st.title);
    if(st.next==="CLOSED") m.closedAt=new Date().toISOString();
    // auto-open next stage where configured (and always open next for linear demo clarity)
    const idx = wf.indexOf(st);
    const nx = wf[idx+1];
    if(nx && (st.auto || true) && st.next!=="CLOSED"){
      // For non-auto stages there is normally real-world work in between; in the
      // demo we open the next stage immediately so the flow is easy to follow.
      openStageOn(m, nx);
      m.status = nx.status || m.status;
      // keep status meaningful: if next stage status undefined, set to its first
      if(nx.stage==="CLOSEOUT") m.status="CLOSEOUT";
      if(nx.stage==="HANDOVER") m.status="HANDOVER";
      if(nx.stage==="FINAL_APPROVAL") m.status="REVIEW";
      if(nx.stage==="RESTORATION") m.status="ACTIVE";
    }
  }
  save(); go("moc",{id:mocId});
}

// boot
render();
</script>

</html>
